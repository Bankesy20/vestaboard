name: Update Vestaboard

on:
  schedule:
    # 10 minutes past every hour. GitHub often delays or drops jobs
    # scheduled for minute 0, which is its busiest minute.
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send weather to the Note
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
        run: python3 weather_board.py --send
