name: Update Vestaboard

on:
  schedule:
    # Top of every hour, UTC, which is also on the hour in the UK.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send weather to the Note
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
        run: python3 weather_board.py --send
